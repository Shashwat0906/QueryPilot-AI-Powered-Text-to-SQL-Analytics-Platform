server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the FastAPI container (same origin for the browser).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        # Real client IP, so the backend rate-limits each user, not nginx itself.
        # Overwrite (don't append to) X-Forwarded-For so a client can't spoof it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/schema, /history, ...) all serve the SPA.
    location / {
        try_files $uri /index.html;
    }
}
