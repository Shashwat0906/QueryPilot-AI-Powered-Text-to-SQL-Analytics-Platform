# Runs on every push and pull request. Render deploys the backend only after
# this passes (autoDeployTrigger: checksPass in render.yaml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qp
          POSTGRES_PASSWORD: qp
          POSTGRES_DB: querypilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qp" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      QP_TEST_POSTGRES_URL: postgresql://qp:qp@localhost:5432/querypilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      # The tests build their own temporary database; the evaluation scripts
      # use the default one, so create it first.
      - run: python -m scripts.seed_database
      - run: python -m scripts.fault_injection

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
